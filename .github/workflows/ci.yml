name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # devDependencies only (typescript, @types/node, pi types). Pi installs this
      # package with --omit=dev, so none of this reaches users.
      - name: Install dev tooling
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
